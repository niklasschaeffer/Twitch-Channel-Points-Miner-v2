<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Channel Points Miner</title>
    <link rel="icon" type="image/png" sizes="32x32"
        href="https://static.twitchcdn.net/assets/favicon-32-e29e246c157142c94346.png">
    <link rel="icon" type="image/png" sizes="16x16"
        href="https://static.twitchcdn.net/assets/favicon-16-52e571ffea063af7a7f4.png">

    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.42.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="{{url_for('static', filename='dark-theme.css')}}" rel="stylesheet" />
    <link href="{{url_for('static', filename='style.css')}}" rel="stylesheet" />
</head>

<body>
    <div id="app" class="app">
        <header id="header" class="app-header">
            <div class="header-content">
                <a href="https://github.com/niklasschaeffer/Twitch-Channel-Points-Miner-v2" target="_blank" class="logo">
                    <img src="{{url_for('static', filename='banner.png')}}" alt="banner">
                </a>
                <div class="header-badges">
                    <a href="https://github.com/niklasschaeffer/Twitch-Channel-Points-Miner-v2/blob/master/LICENSE">
                        <img alt="License" src="https://img.shields.io/github/license/niklasschaeffer/Twitch-Channel-Points-Miner-v2" />
                    </a>
                    <a href="https://github.com/niklasschaeffer/Twitch-Channel-Points-Miner-v2/releases">
                        <img alt="GitHub last commit" src="https://img.shields.io/github/last-commit/niklasschaeffer/Twitch-Channel-Points-Miner-v2" />
                    </a>
                </div>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <div class="dropdown is-hoverable">
                    <div class="dropdown-trigger">
                        <button class="button is-small" aria-haspopup="true" aria-controls="dropdown-menu">
                            <span id="sorting-by"></span>
                            <span class="icon is-small"><i class="fas fa-angle-down" aria-hidden="true"></i></span>
                        </button>
                    </div>
                    <div class="dropdown-menu" id="dropdown-menu" role="menu">
                        <div class="dropdown-content is-small">
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Name ascending</a>
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Name descending</a>
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Points ascending</a>
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Points descending</a>
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Last activity ascending</a>
                            <a href="#" class="dropdown-item" onClick="changeSortBy(this)">Last activity descending</a>
                        </div>
                    </div>
                </div>
                <div class="date-inputs">
                    <input class="input is-small" type="date" id="startDate">
                    <span class="date-separator">→</span>
                    <input class="input is-small" type="date" id="endDate">
                </div>
            </div>
            <div class="toolbar-right">
                <button id="auto-update-log" class="button is-small is-text">⏸️</button>
                <label class="toolbar-toggle"><input type="checkbox" id="log"><span>Log</span></label>
                <label class="toolbar-toggle"><input type="checkbox" checked="true" id="annotations"><span>Annotations</span></label>
                <label class="toolbar-toggle"><input type="checkbox" checked="true" id="dark-mode"><span>Dark</span></label>
                <label class="toolbar-toggle"><input type="checkbox" checked="true" id="toggle-header"><span>Header</span></label>
            </div>
        </div>

        <div class="dashboard">
            <aside class="streamer-sidebar">
                <div class="sidebar-title">
                    <i class="fas fa-users"></i>
                    <span>Streamers</span>
                </div>
                <div class="tabs" id="streamers-list"></div>
            </aside>
            <main class="chart-area">
                <div class="card chart-card" id="chart"></div>
            </main>
        </div>

        <div class="log-area" id="log-box">
            <div class="card log-card">
                <pre id="log-content">In your run.py file set save=True in logger_settings to save logs to a file.&#10;&#13;</pre>
            </div>
        </div>
    </div>
</body>

<script type="text/javascript">
    function toggleDarkMode() {
        var darkMode = $('#dark-mode').prop("checked")
        $("link[href='{{url_for('static', filename='dark-theme.css')}}']").prop("disabled", !darkMode);
        chart.updateOptions({
            colors: darkMode === true ? ["#a970ff"] : ['#008ffb'],
            chart: {
                foreColor: darkMode === true ? "#efeff1" : '#373d3f'
            },
            tooltip: {
                theme: darkMode === true ? "dark" : "light"
            }
        })
    }
    var refresh = parseInt("{{ refresh }}");
    var daysAgo = parseInt("{{ daysAgo }}");
</script>
<script type="text/javascript" src="{{url_for('static', filename='script.js')}}"></script>

</html>
